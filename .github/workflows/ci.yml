# =============================================================================
# CI EAP — Gate Konsistensi Data KEIS
#
# Job `eap` (mandiri): pemeriksa XSS UI, uji DB (tests/run_all.sh), API typecheck,
# build dan e2e — tidak bergantung pada CMP.
#
# Job `cross-check` menjalankan dua gate yang dituntut oleh dokumen:
#   1. scripts/cross_check_shared.sh   → PRD EAP NFR-18 · DATABASE-REVIEW ADR-CMP-004
#   2. scripts/cross_check_consumers.sh→ PRD EAP NFR-17 · DATABASE-REVIEW ADR-CMP-005
#
# Kedua gate membandingkan database EAP dengan database CMP, sehingga workflow
# ini membutuhkan skema CMP (repositori saudara). Bila repositori CMP tidak
# tersedia, job akan gagal dengan pesan yang jelas (bukan lolos diam-diam).
# =============================================================================
name: CI EAP — Gate Konsistensi Data KEIS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PGHOST: localhost
  PGPORT: "5432"
  PGUSER: postgres
  PGPASSWORD: postgres
  EAP_DB: kalla_eap
  CMP_DB: kalla_cmp

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — EAP mandiri: tidak butuh repositori CMP, sehingga regresi EAP selalu
  # terlihat terpisah dari ketersediaan CMP.
  # ---------------------------------------------------------------------------
  eap:
    name: EAP — uji DB, typecheck, build, e2e API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout EAP
        uses: actions/checkout@v4

      # XSS: data tidak boleh disisipkan ke string JS di atribut handler (gunakan window.jsArg) — tanpa dependensi.
      - name: Pemeriksa XSS handler inline UI
        run: python3 scripts/check_ui_handlers.py

      - name: Uji DB EAP (DDL + seed 2× + migrasi + tests/*.test.sql + pii_guard)
        run: bash tests/run_all.sh

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"          # sama dengan NODE_VERSION di infra/docker/api.Dockerfile
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: API — install, typecheck, build
        working-directory: api
        run: |
          npm ci
          npm run typecheck
          npm run build

      # e2e: DROP/CREATE kalla_eap_api_test. Uji yang butuh LLM/S3/GitHub sungguhan dilewati otomatis.
      - name: API — e2e
        working-directory: api
        env:
          # Runner ubuntu-24.04 membatasi user namespace (AppArmor) sehingga sandbox Chrome gagal;
          # hanya untuk VM CI sekali pakai yang merender fixture uji — JANGAN di produksi.
          PDF_NO_SANDBOX: "1"
        run: npm test

  # ---------------------------------------------------------------------------
  # Job 1b — eap/web (SPA Next.js): typecheck (termasuk uji Playwright e2e/), kamus i18n (0 kunci hilang) dan build ekspor statis.
  # Uji ber-login Playwright butuh stack penuh → dijalankan di infra/.github/workflows/images.yml (job smoke, langkah "Uji web (Playwright)").
  # ---------------------------------------------------------------------------
  web:
    name: EAP web — typecheck, i18n, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout EAP
        uses: actions/checkout@v4

      - name: Siapkan Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web — install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Web — typecheck (src + e2e)
        working-directory: web
        run: npm run typecheck

      - name: "Web — kamus i18n (UI dua bahasa, tanpa teks yang belum diterjemahkan ke EN)"
        working-directory: web
        run: npm run i18n:check

      - name: Web — build (ekspor statis)
        working-directory: web
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 2 — gerbang konsistensi EAP ↔ CMP (butuh repositori saudara CMP).
  # ---------------------------------------------------------------------------
  cross-check:
    name: cross_check_shared + cross_check_consumers
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout EAP
        uses: actions/checkout@v4

      # Skema CMP adalah sumber kebenaran untuk modul shared dan publikasi CDC.
      - name: Checkout CMP (repositori saudara)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cmp
          path: .cmp
        continue-on-error: true

      - name: Verifikasi ketersediaan skema CMP
        run: |
          if [ ! -d .cmp/database ]; then
            echo "::error::Repositori CMP tidak ditemukan. Gate ini membandingkan"
            echo "::error::kalla_eap dengan kalla_cmp — keduanya wajib tersedia."
            echo "::error::Susunan yang diharapkan: <root>/{eap,cmp}/"
            exit 1
          fi

      - name: Terapkan DDL CMP -> kalla_cmp
        run: |
          createdb "$CMP_DB"
          # urutan penting: urutkan nama berkas, 000_init lebih dulu
          for f in $(ls .cmp/database/*.sql | sort); do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -q -d "$CMP_DB" -f "$f"
          done

      - name: Siapkan skema EAP -> kalla_eap
        run: |
          createdb "$EAP_DB"
          # DDL EAP (000-295 + seed 9xx) lalu migrasi; shared/010 identik dengan CMP (dicek Gate 1).
          for f in $(ls database/*.sql | sort) $(ls migrations/*.sql | sort); do
            echo "==> $f"
            psql -v ON_ERROR_STOP=1 -q -d "$EAP_DB" -f "$f"
          done

      - name: "Gate 1 — cross_check_shared.sh (NFR-18 / ADR-CMP-004)"
        run: bash scripts/cross_check_shared.sh

      - name: "Gate 2 — cross_check_consumers.sh (NFR-17 / ADR-CMP-005)"
        run: bash scripts/cross_check_consumers.sh
